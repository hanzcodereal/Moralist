# Daemon dibatasi agar memori tidak membengkak.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=4
# Daemon Kotlin terpisah akan menahan satu heap compiler tambahan di samping Gradle.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Timeout lebih panjang untuk unduhan dari JitPack.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

org.gradle.caching=true
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
org.gradle.tooling.parallel=true

appVersion=2.0.0
innerTubeXVersion=v0.11.9

# Alamat web server Moralist (ganti dengan domain deploy kamu), dipakai untuk cek pembaruan & unduhan.
moralistServerUrl=https://moralist.up.railway.app
